name: rag-multi-agents

on:
  push:
    branches: [main]
    paths:
      - "rag-multi-agents/**"
      - ".github/workflows/rag-multi-agents.yml"
  pull_request:
    paths:
      - "rag-multi-agents/**"
      - ".github/workflows/rag-multi-agents.yml"

defaults:
  run:
    working-directory: rag-multi-agents

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check src tests demo
      - run: uv run ruff format --check src tests demo
      - run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-multi-agents .
      - run: docker compose config --quiet
