[project]
name = "multi-agent-debate-math"
version = "0.1.0"
description = "Débat multi-agents vs vote majoritaire à budget égal sur GSM8K et MATH-500"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.100",
    "langgraph>=1.2",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "math-verify[antlr4_13_2]>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
]

[project.scripts]
debate = "debate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
