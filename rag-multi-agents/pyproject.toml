[project]
name = "rag-multi-agents"
version = "0.1.0"
description = "Système RAG multi-agents sur documents métier (LangChain, LangGraph, ChromaDB, FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-community>=0.4",
    "langgraph>=1.2",
    "langchain-chroma>=1.1",
    "chromadb>=1.5",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7"]
openai = ["langchain-openai>=1.6"]
ollama = ["langchain-ollama>=1.1"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
